<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windshield Fit Detection</title>

<style>
    body {
        background:#111;
        color:#fff;
        font-family:Arial;
        text-align:center;
        padding:20px;
    }

    #container {
        position: relative;
        width: 100%;
        max-width: 640px;
        margin: auto;
    }

    #camera {
        width: 100%;
        border-radius: 12px;
        background: black;
    }

    /* ONLY ONE guide rectangle visible */
    #guideBox {
        position: absolute;
        left: 10%;
        top: 30%;
        width: 80%;
        height: 40%;
        border: 5px solid red;
        border-radius: 14px;
        pointer-events: none;
    }

    /* Hidden canvas (used internally only) */
    #hiddenCanvas {
        display:none;
    }

    button {
        margin-top:15px;
        padding:12px 24px;
        font-size:18px;
        background:#444;
        border:none;
        border-radius:8px;
        color:white;
        cursor:pointer;
    }
</style>
</head>

<body>

<h2>Windshield Fit Detection</h2>

<div id="container">
    <video id="camera" autoplay playsinline></video>

    <!-- ONLY rectangle visible -->
    <div id="guideBox"></div>
</div>

<button id="captureBtn">Capture</button>

<!-- Hidden canvas for processing -->
<canvas id="hiddenCanvas"></canvas>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
let video = document.getElementById("camera");
let canvas = document.getElementById("hiddenCanvas");
let ctx = canvas.getContext("2d");
let guideBox = document.getElementById("guideBox");
let canCapture = false;

// ---------------- CAMERA ----------------
navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } })
.then(stream => video.srcObject = stream);

video.addEventListener("loadeddata", () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    setInterval(detectWindshield, 150);
});

// ---------------- DETECT QUAD LOGIC ----------------
function detectWindshield(){
    // Draw video frame to hidden canvas
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Guide rectangle (in CANVAS coordinates)
    let rectX = canvas.width * 0.10;
    let rectY = canvas.height * 0.30;
    let rectW = canvas.width * 0.80;
    let rectH = canvas.height * 0.40;

    // ---- OpenCV ----
    let src = cv.imread(canvas);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let edges = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
    cv.Canny(blur, edges, 70, 140);

    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    let bestQuad = null;
    let bestArea = 0;

    // Find a real 4-corner shape
    for (let i = 0; i < contours.size(); i++){
        let cnt = contours.get(i);
        let peri = cv.arcLength(cnt, true);
        if (peri < 300) continue; // ignore tiny/noisy shapes

        let approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

        if (approx.rows !== 4) continue;

        let area = cv.contourArea(approx);
        if (area < (canvas.width * canvas.height) * 0.25) continue; // must be large

        if (area > bestArea){
            bestArea = area;
            bestQuad = approx;
        }
    }

    // Default invalid
    canCapture = false;
    guideBox.style.borderColor = "red";

    if (bestQuad){
        // Get quad corners
        let pts = [];
        for (let i=0; i<4; i++){
            pts.push({
                x: bestQuad.intPtr(i,0)[0],
                y: bestQuad.intPtr(i,0)[1]
            });
        }

        // Check if quad fully inside guide box
        let inside = pts.every(p =>
            p.x >= rectX &&
            p.x <= rectX + rectW &&
            p.y >= rectY &&
            p.y <= rectY + rectH
        );

        if (inside){
            guideBox.style.borderColor = "lime";
            canCapture = true;
        }
    }

    src.delete(); gray.delete(); blur.delete(); edges.delete();
    contours.delete(); hierarchy.delete();
}

// ---------------- CAPTURE ----------------
document.getElementById("captureBtn").onclick = () => {
    if (!canCapture){
        alert("Windshield not aligned inside the rectangle!");
        return;
    }

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let img = canvas.toDataURL("image/png");

    console.log("Captured image:", img);
    alert("Captured!");
};
</script>

</body>
</html>
