<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windshield Auto Capture</title>

<style>
    body {
        background:#111; color:#eee;
        font-family:Arial; text-align:center; padding:10px;
    }
    #container {
        position:relative;
        width:100%;
        max-width:640px;
        margin:auto;
    }
    video {
        width:100%;
        border-radius:12px;
        background:black;
    }
    #camCanvas {
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        border-radius:12px;
        pointer-events:none;
    }
    #frameIndicator {
        position:absolute;
        top:10%; left:10%;
        width:80%; height:80%;
        border:4px solid red;
        border-radius:10px;
        pointer-events:none;
        transition:0.2s ease;
    }
    button {
        margin-top:15px;
        padding:12px 20px;
        font-size:18px;
        border:none;
        background:#444;
        color:white;
        border-radius:8px;
        cursor:pointer;
    }
</style>

</head>

<body>

<h2>Windshield Fit Detection</h2>

<div id="container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="camCanvas"></canvas>

    <!-- Green/Red Frame Indicator -->
    <div id="frameIndicator"></div>
</div>

<button id="captureBtn">Capture</button>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
// ====================== CONFIG ======================
const COVERAGE_THRESHOLD = 0.50;  // 50%
const MIN_QUAD_AREA = 0.10;       // ignore tiny quads

let video = document.getElementById("camera");
let camCanvas = document.getElementById("camCanvas");
let ctx = camCanvas.getContext("2d");
let frameIndicator = document.getElementById("frameIndicator");
let canCapture = false;

// ====================== CAMERA ======================
navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } })
.then(stream => video.srcObject = stream);

video.addEventListener("loadeddata", () => {
    camCanvas.width = video.videoWidth;
    camCanvas.height = video.videoHeight;
    setInterval(runDetection, 200);
});

// ====================== MAIN DETECTION ======================
function runDetection(){
    ctx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);

    // --- Draw CENTER RECTANGLE ---
    let cx = camCanvas.width * 0.15;
    let cy = camCanvas.height * 0.15;
    let cw = camCanvas.width * 0.70;
    let ch = camCanvas.height * 0.70;

    let guideRect = {x:cx, y:cy, w:cw, h:ch};

    // Draw guide box (color later replaced)
    ctx.lineWidth = 4;
    ctx.strokeStyle = "yellow";
    ctx.strokeRect(cx, cy, cw, ch);

    // --- OpenCV processing ---
    let src = cv.imread(camCanvas);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let edges = new cv.Mat();
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
    cv.Canny(blur, edges, 80, 150);

    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    let bestQuad = null;
    let bestArea = 0;
    let frameArea = camCanvas.width * camCanvas.height;

    // --- Find best quadrilateral ---
    for (let i=0; i<contours.size(); i++){
        let cnt = contours.get(i);
        let peri = cv.arcLength(cnt, true);
        let approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

        if (approx.rows === 4){
            let area = cv.contourArea(approx);

            if (area/frameArea > MIN_QUAD_AREA && area > bestArea){
                bestArea = area;
                bestQuad = approx;
            }
        }
    }

    canCapture = false;

    if (bestQuad){
        let coverage = bestArea / frameArea;

        // Get quad coords
        let pts = [];
        for (let i = 0; i < 4; i++){
            pts.push({
                x: bestQuad.intPtr(i,0)[0],
                y: bestQuad.intPtr(i,0)[1]
            });
        }

        // Draw detected quad
        ctx.strokeStyle = "cyan";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i=1; i<4; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
        ctx.stroke();

        // Check if quad is INSIDE guide box
        let insideGuide = pts.every(p =>
            p.x >= guideRect.x &&
            p.x <= guideRect.x + guideRect.w &&
            p.y >= guideRect.y &&
            p.y <= guideRect.y + guideRect.h
        );

        // Final validation
        if (insideGuide && coverage >= COVERAGE_THRESHOLD){
            frameIndicator.style.borderColor = "lime";
            ctx.strokeStyle = "lime";
            ctx.strokeRect(cx, cy, cw, ch);
            canCapture = true;
        } else {
            frameIndicator.style.borderColor = "red";
            ctx.strokeStyle = "red";
            ctx.strokeRect(cx, cy, cw, ch);
        }
    }

    // Cleanup
    src.delete(); gray.delete(); blur.delete(); edges.delete();
    contours.delete(); hierarchy.delete();
}

// ====================== CAPTURE ======================
document.getElementById("captureBtn").onclick = () => {
    if (!canCapture){
        alert("Windshield NOT properly aligned. Move camera and try again.");
        return;
    }

    let data = camCanvas.toDataURL("image/png");
    alert("Captured Successfully!");
    console.log("Captured image:", data);
};
</script>


</body>
</html>
